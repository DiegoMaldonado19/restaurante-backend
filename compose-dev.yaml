name: restaurante-backend-dev

services:
  mariadb:
    image: mariadb:11
    container_name: restaurante_mariadb_dev
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_dev}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-restaurant_db}
      MARIADB_USER: ${MARIADB_USER:-restaurant}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-restaurant_dev}
      TZ: America/Guatemala
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: djmaldonado19/restaurante-backend:dev
    pull_policy: always
    container_name: restaurante_backend_dev
    command: >
      sh -c "touch /tmp/build;
      { while sleep 2; do find src/main -newer /tmp/build -print -quit | grep -q . && { touch /tmp/build; mvn -q compile; }; done; } &
      mvn spring-boot:run"
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/${MARIADB_DATABASE:-restaurant_db}
      SPRING_DATASOURCE_USERNAME: ${MARIADB_USER:-restaurant}
      SPRING_DATASOURCE_PASSWORD: ${MARIADB_PASSWORD:-restaurant_dev}
      TZ: America/Guatemala
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - maven_repo:/root/.m2
      - build_output:/app/target
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

volumes:
  mariadb_data:
  maven_repo:
  build_output:
