spring.application.name=restaurant

# --- Persistencia -----------------------------------------------------------
# El esquema lo gobierna Flyway; Hibernate solo verifica que las entidades cuadren.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true

# --- JSON -------------------------------------------------------------------
# Payload en snake_case, campos de la clase en lowerCamelCase.
# Una linea aplica la regla a TODOS los DTO: no se anota campo por campo.
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

# --- Correo -----------------------------------------------------------------
# Sin spring.mail.host la autoconfiguracion no construye el JavaMailSender y las
# credenciales llegan sin que las use nadie. MAIL_PASSWORD es una contrasena de
# aplicacion de Google, no la del correo.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Paginacion -------------------------------------------------------------
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# --- Servidor ---------------------------------------------------------------
server.port=8080

# --- Swagger / OpenAPI ------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# --- Seguridad --------------------------------------------------------------
restaurant.security.jwt.secret=${APP_SECURITY_JWT_SECRET:cambiar-por-un-secreto-de-al-menos-32-bytes}
restaurant.security.jwt.access-minutes=720
restaurant.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}

# --- Reglas de negocio que el enunciado deja al equipo -----------------------
# Valores iniciales. La configuracion editable vive en la tabla restaurant_setting
# (PUT /settings); estas propiedades son la semilla y el respaldo.
restaurant.tax.percent=12
restaurant.tip.suggested-percent=10
restaurant.loyalty.points-per-currency-unit=1
restaurant.loyalty.currency-per-point=0.10
restaurant.order.overdue-grace-minutes=5
restaurant.reservation.grace-minutes=30
